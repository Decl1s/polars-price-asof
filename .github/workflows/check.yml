name: Я проверяю исторические цены и выпускаю исходники
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: price-asof-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Я устанавливаю полное дерево по закреплённым хешам
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Я проверяю совместимость установленных пакетов
        run: |
          python -m pip --version
          python -m pip check
      - name: Я проверяю join, Parquet, CLI, отказы и упражнения
        run: python scripts/ci.py
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Decl1s/polars-price-asof'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.10'
      - name: Я выпускаю source ZIP и SHA256 после обеих ОС
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
